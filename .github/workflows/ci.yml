name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history needed so gitleaks scans everything, not just the diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Secret scan (gitleaks)
        # Runs the CLI directly against the full checked-out history rather than the
        # gitleaks-action wrapper, which only diffs the push's before/after SHAs — that
        # range is unresolvable on a repo whose remote history was replaced (e.g. the
        # first push over a GitHub-initialised README), and it also does not satisfy
        # FR-9's "must scan full history, not just the diff" requirement.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact -v --exit-code=1 \
            --report-format=sarif --report-path=gitleaks-results.sarif

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          if-no-files-found: ignore

      # Git on Windows does not preserve the Unix executable bit, so mvnw is committed
      # without it. Restoring it here rather than relying on the committer's OS.
      - name: Make Maven Wrapper executable
        working-directory: api
        run: chmod +x mvnw

      - name: Build, unit + integration tests, merged coverage
        working-directory: api
        run: ./mvnw --batch-mode verify

      - name: Enforce coverage gate on merged unit+IT data
        working-directory: api
        run: ./mvnw --batch-mode jacoco:check@check-merged

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Surefire & Failsafe results
          # TEST-*.xml excludes failsafe-summary.xml, which is not a JUnit report and
          # crashes the parser if matched by a bare *.xml glob.
          path: "api/target/surefire-reports/TEST-*.xml,api/target/failsafe-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-merged-report
          path: api/target/site/jacoco-merged/
