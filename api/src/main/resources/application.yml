spring:
  application:
    name: supportsense-api
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      # Never 'update'. Flyway owns the schema; Hibernate only verifies it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

server:
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: supportsense-api

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

supportsense:
  security:
    jwt-secret: ${SUPPORTSENSE_SECURITY_JWT_SECRET:}
    admin-password: ${SUPPORTSENSE_SECURITY_ADMIN_PASSWORD:}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  ingestion:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 500
    stale-claim-threshold: PT15M
    max-attempts: 3
    untriaged-orphan-threshold: PT1H
    fallback-team-slug: customer-success
  pre-screen:
    terms:
      # Billing
      - refund
      - chargeback
      - invoice
      - overcharge
      - billing dispute
      - cancel subscription
      - downgrade
      - prorate
      # Legal
      - lawsuit
      - legal
      - attorney
      - solicitor
      - subpoena
      - liability
      - terms of service violation
      # Compliance / privacy
      - GDPR
      - CCPA
      - DPA
      - data deletion
      - right to be forgotten
      - breach
      - PII
      # Escalation signals
      - escalate to manager
      - unacceptable
      - cancel my account
      - speak to a supervisor
