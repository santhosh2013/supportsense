# Deployed environment. Every secret comes from the platform's secret manager.
# Startup fails if SUPPORTSENSE_SECURITY_JWT_SECRET or SUPPORTSENSE_SECURITY_ADMIN_PASSWORD
# is absent — there is no fallback.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
